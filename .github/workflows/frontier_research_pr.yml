name: frontier-097-research-pr

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/frontier_research_pr.yml

permissions:
  contents: read

concurrency:
  group: frontier-097-research-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATA_DIR: data
  PYTHONUNBUFFERED: "1"

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[diversity]"
      - name: Download public competition mirror
        run: |
          mkdir -p "$DATA_DIR"
          base="https://raw.githubusercontent.com/s23010843/Predicting-Smartphone-Addiction/main/input"
          curl -fL --retry 5 "$base/train.csv" -o "$DATA_DIR/train.csv"
          curl -fL --retry 5 "$base/test.csv" -o "$DATA_DIR/test.csv"
          curl -fL --retry 5 "$base/sample_submission.csv" -o "$DATA_DIR/sample_submission.csv"
          python -m s6e8 validate --data-dir "$DATA_DIR"
      - name: Build production inner-10 TE anchor
        run: |
          python experiments/live_frontier_candidate.py \
            --data-dir "$DATA_DIR" \
            --out-dir artifacts/anchor_i10 \
            --folds 5 --inner-folds 10 --smoothing 10 \
            --seed 20260801 --lgb-estimators 4500 --xgb-estimators 3000
      - name: Verify anchor contract
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('artifacts/anchor_i10/decision.json').read_text())
          print(json.dumps(d, indent=2))
          if d['auc']['honest_blend'] < 0.9675:
              raise SystemExit('anchor AUC unexpectedly low')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-anchor-i10
          path: artifacts/anchor_i10
          retention-days: 7

  lgb-identity-screen:
    needs: anchor
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[diversity]"
      - name: Download mirror
        run: |
          mkdir -p "$DATA_DIR"
          base="https://raw.githubusercontent.com/s23010843/Predicting-Smartphone-Addiction/main/input"
          curl -fL --retry 5 "$base/train.csv" -o "$DATA_DIR/train.csv"
          curl -fL --retry 5 "$base/test.csv" -o "$DATA_DIR/test.csv"
          curl -fL --retry 5 "$base/sample_submission.csv" -o "$DATA_DIR/sample_submission.csv"
      - uses: actions/download-artifact@v4
        with:
          name: frontier-anchor-i10
          path: artifacts/anchor_i10
      - name: Run fixed-900 LightGBM representation contrast
        run: |
          python experiments/frontier_contrast_campaign.py \
            --data-dir "$DATA_DIR" \
            --anchor-oof artifacts/anchor_i10/oof.csv \
            --anchor-test artifacts/anchor_i10/submission_blend.csv \
            --family lgb --treatment identity_screen --rounds 900 \
            --seed 20260801 \
            --out-dir artifacts/contrast_lgb_identity_screen
      - uses: actions/upload-artifact@v4
        with:
          name: contrast-lgb-identity-screen
          path: artifacts/contrast_lgb_identity_screen
          retention-days: 7

  xgb-identity-screen:
    needs: anchor
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[diversity]"
      - name: Download mirror
        run: |
          mkdir -p "$DATA_DIR"
          base="https://raw.githubusercontent.com/s23010843/Predicting-Smartphone-Addiction/main/input"
          curl -fL --retry 5 "$base/train.csv" -o "$DATA_DIR/train.csv"
          curl -fL --retry 5 "$base/test.csv" -o "$DATA_DIR/test.csv"
          curl -fL --retry 5 "$base/sample_submission.csv" -o "$DATA_DIR/sample_submission.csv"
      - uses: actions/download-artifact@v4
        with:
          name: frontier-anchor-i10
          path: artifacts/anchor_i10
      - name: Run fixed-1500 XGBoost representation contrast
        run: |
          python experiments/frontier_contrast_campaign.py \
            --data-dir "$DATA_DIR" \
            --anchor-oof artifacts/anchor_i10/oof.csv \
            --anchor-test artifacts/anchor_i10/submission_blend.csv \
            --family xgb --treatment identity_screen --rounds 1500 \
            --seed 20260801 \
            --out-dir artifacts/contrast_xgb_identity_screen
      - uses: actions/upload-artifact@v4
        with:
          name: contrast-xgb-identity-screen
          path: artifacts/contrast_xgb_identity_screen
          retention-days: 7

  cat-exact-screen:
    needs: anchor
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[diversity]"
      - name: Download mirror
        run: |
          mkdir -p "$DATA_DIR"
          base="https://raw.githubusercontent.com/s23010843/Predicting-Smartphone-Addiction/main/input"
          curl -fL --retry 5 "$base/train.csv" -o "$DATA_DIR/train.csv"
          curl -fL --retry 5 "$base/test.csv" -o "$DATA_DIR/test.csv"
          curl -fL --retry 5 "$base/sample_submission.csv" -o "$DATA_DIR/sample_submission.csv"
      - uses: actions/download-artifact@v4
        with:
          name: frontier-anchor-i10
          path: artifacts/anchor_i10
      - name: Enable exact CatBoost treatments in research runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/frontier_contrast_campaign.py')
          s=p.read_text()
          old='choices=["identity", "screen", "identity_screen"]'
          new='choices=["exact", "exact_screen", "identity", "screen", "identity_screen"]'
          if old not in s:
              raise SystemExit('expected treatment choice declaration not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Run fixed-4000 exact-value CatBoost contrast
        run: |
          python experiments/frontier_contrast_campaign.py \
            --data-dir "$DATA_DIR" \
            --anchor-oof artifacts/anchor_i10/oof.csv \
            --anchor-test artifacts/anchor_i10/submission_blend.csv \
            --family cat --treatment exact --rounds 4000 \
            --seed 20260801 \
            --out-dir artifacts/contrast_cat_exact
      - name: Run fixed-4000 CatBoost screen contrast reusing raw control
        run: |
          python experiments/frontier_contrast_campaign.py \
            --data-dir "$DATA_DIR" \
            --anchor-oof artifacts/anchor_i10/oof.csv \
            --anchor-test artifacts/anchor_i10/submission_blend.csv \
            --family cat --treatment screen --rounds 4000 \
            --seed 20260801 \
            --reuse-control-dir artifacts/contrast_cat_exact \
            --out-dir artifacts/contrast_cat_screen
      - uses: actions/upload-artifact@v4
        with:
          name: contrast-cat-exact-screen
          path: |
            artifacts/contrast_cat_exact
            artifacts/contrast_cat_screen
          retention-days: 7

  finalize:
    if: always()
    needs: [anchor, lgb-identity-screen, xgb-identity-screen, cat-exact-screen]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[diversity]"
      - name: Download mirror
        run: |
          mkdir -p "$DATA_DIR"
          base="https://raw.githubusercontent.com/s23010843/Predicting-Smartphone-Addiction/main/input"
          curl -fL --retry 5 "$base/train.csv" -o "$DATA_DIR/train.csv"
          curl -fL --retry 5 "$base/test.csv" -o "$DATA_DIR/test.csv"
          curl -fL --retry 5 "$base/sample_submission.csv" -o "$DATA_DIR/sample_submission.csv"
      - uses: actions/download-artifact@v4
        with:
          name: frontier-anchor-i10
          path: artifacts/anchor_i10
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: contrast-lgb-identity-screen
          path: artifacts/contrast_lgb_identity_screen
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: contrast-xgb-identity-screen
          path: artifacts/contrast_xgb_identity_screen
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: contrast-cat-exact-screen
          path: artifacts/cat_bundle
      - name: Normalize CatBoost artifact paths
        run: |
          mkdir -p artifacts/contrast_cat_exact artifacts/contrast_cat_screen
          if [ -d artifacts/cat_bundle/contrast_cat_exact ]; then cp -a artifacts/cat_bundle/contrast_cat_exact/. artifacts/contrast_cat_exact/; fi
          if [ -d artifacts/cat_bundle/contrast_cat_screen ]; then cp -a artifacts/cat_bundle/contrast_cat_screen/. artifacts/contrast_cat_screen/; fi
      - name: Compose accepted directions and choose best honest candidate
        run: |
          python - <<'PY'
          import json, pathlib, shutil, subprocess
          root=pathlib.Path('artifacts')
          dirs=[root/'contrast_lgb_identity_screen',root/'contrast_xgb_identity_screen',root/'contrast_cat_exact',root/'contrast_cat_screen']
          accepted=[]; rows=[]
          anchor=json.loads((root/'anchor_i10'/'decision.json').read_text())
          rows.append({'name':'anchor_i10','auc':anchor['auc']['honest_blend'],'accepted':True,'deploy_weight':0.0})
          for d in dirs:
              p=d/'decision.json'
              if not p.exists():
                  rows.append({'name':d.name,'status':'missing_or_failed'}); continue
              x=json.loads(p.read_text()); g=x['residual_gate']
              auc=float(g.get('honest_auc', g.get('candidate_auc', x['standalone']['anchor_auc'])))
              rows.append({'name':d.name,'auc':auc,'accepted':bool(g.get('accepted')),'deploy_weight':float(g.get('deploy_weight',0.0)),'standalone_control':x['standalone']['control_auc'],'standalone_treatment':x['standalone']['treatment_auc']})
              if g.get('accepted'): accepted.append(d)
          composite=None
          if len(accepted)>=2:
              cmd=['python','experiments/frontier_direction_composer.py','--data-dir','data','--anchor-oof','artifacts/anchor_i10/oof.csv','--anchor-test','artifacts/anchor_i10/submission_blend.csv','--direction-dirs',*[str(d) for d in accepted],'--mode','sequential_orthogonal','--out-dir','artifacts/composite']
              subprocess.run(cmd,check=True)
              c=json.loads((root/'composite'/'decision.json').read_text()); g=c['residual_gate']; auc=float(g.get('honest_auc',g.get('candidate_auc',c['anchor_auc'])))
              rows.append({'name':'composite','auc':auc,'accepted':bool(g.get('accepted')),'deploy_weight':float(g.get('deploy_weight',0.0))})
              if g.get('accepted'): composite=root/'composite'
          candidates=[('anchor_i10',float(anchor['auc']['honest_blend']),root/'anchor_i10'/'submission_blend.csv')]
          for d in accepted:
              x=json.loads((d/'decision.json').read_text()); g=x['residual_gate']; auc=float(g.get('honest_auc',g.get('candidate_auc',x['standalone']['anchor_auc'])))
              candidates.append((d.name,auc,d/'submission_gated.csv'))
          if composite is not None:
              c=json.loads((composite/'decision.json').read_text()); g=c['residual_gate']; auc=float(g.get('honest_auc',g.get('candidate_auc',c['anchor_auc'])))
              candidates.append(('composite',auc,composite/'submission_gated.csv'))
          best=max(candidates,key=lambda z:z[1]); out=root/'final'; out.mkdir(exist_ok=True)
          shutil.copy2(best[2],out/'submission_best.csv')
          summary={'anchor_auc':float(anchor['auc']['honest_blend']),'measurements':rows,'accepted_directions':[d.name for d in accepted],'best':{'name':best[0],'honest_oof_auc':best[1],'source':str(best[2])}}
          (out/'research_summary.json').write_text(json.dumps(summary,indent=2)+'\n'); print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-097-final-research
          path: |
            artifacts/final
            artifacts/anchor_i10/decision.json
            artifacts/contrast_lgb_identity_screen/decision.json
            artifacts/contrast_xgb_identity_screen/decision.json
            artifacts/contrast_cat_exact/decision.json
            artifacts/contrast_cat_screen/decision.json
            artifacts/composite/decision.json
          if-no-files-found: warn
          retention-days: 14
