name: materialize-selected-kaggle-submission

on:
  push:
    branches: [agent/frontier-097-campaign]
    paths:
      - .github/workflows/materialize_selected_submission.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontier-097-campaign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reconstruction dependencies
        run: pip install numpy pandas scipy kagglehub
      - name: Recover audited NOMOPHOBIA direction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/contrast_lgb
          curl -fL --retry 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9346320480/zip" \
            -o /tmp/contrast-lgb.zip
          unzip -q /tmp/contrast-lgb.zip -d /tmp/contrast_lgb
          test -f /tmp/contrast_lgb/direction_test.npy
      - name: Reconstruct and verify selected submission
        run: |
          curl -fL --retry 5 \
            https://raw.githubusercontent.com/s23010843/Predicting-Smartphone-Addiction/main/input/test.csv \
            -o /tmp/test.csv
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import kagglehub
          import numpy as np
          import pandas as pd
          from scipy.stats import rankdata

          EXPECTED_SHA = "e2d0866a57590dce5e20ce4f98edb9cf1822e79a6af7e17cc0be22e887f905a2"
          EXPECTED_ROWS = 296_302
          EXPECTED_UNIQUE = 295_801
          WEIGHT = 0.015

          def rank01(x):
              x = np.asarray(x, dtype=float)
              return rankdata(x, method="average") / len(x)

          root = Path(kagglehub.dataset_download("najiama/predicting-smartphone-addiction-oof-submission-csv"))
          candidates = list(root.rglob("19_blend_submission.csv.csv"))
          if not candidates:
              candidates = list(root.rglob("19_blend_submission.csv"))
          if len(candidates) != 1:
              raise RuntimeError(f"Expected one v19 submission, found: {candidates}")

          anchor = pd.read_csv(candidates[0])
          official_test = pd.read_csv("/tmp/test.csv", usecols=["id"])
          direction = np.load("/tmp/contrast_lgb/direction_test.npy", allow_pickle=False)

          assert list(anchor.columns) == ["id", "addicted_label"], anchor.columns
          assert len(anchor) == len(official_test) == len(direction) == EXPECTED_ROWS
          assert np.array_equal(anchor["id"].to_numpy(), official_test["id"].to_numpy())
          assert np.isfinite(anchor["addicted_label"].to_numpy(float)).all()
          assert np.isfinite(direction).all()

          pred = rank01(rank01(anchor["addicted_label"].to_numpy(float)) + WEIGHT * direction)
          out = pd.DataFrame({"id": anchor["id"].to_numpy(), "addicted_label": pred})
          assert out["id"].nunique() == EXPECTED_ROWS
          assert out["addicted_label"].nunique() == EXPECTED_UNIQUE
          assert np.isfinite(out["addicted_label"].to_numpy()).all()

          path = Path("kaggle/submission_nomophobia_v19_lgb015.csv")
          out.to_csv(path, index=False)
          sha = hashlib.sha256(path.read_bytes()).hexdigest()
          if sha != EXPECTED_SHA:
              raise RuntimeError(f"Submission SHA mismatch: {sha} != {EXPECTED_SHA}")

          record = {
              "selected_submission": path.name,
              "sha256": sha,
              "rows": len(out),
              "unique_ids": int(out["id"].nunique()),
              "unique_predictions": int(out["addicted_label"].nunique()),
              "public_anchor": "Naji v19 audited blend",
              "public_anchor_oof_auc": 0.9700992093622354,
              "nomophobia_direction": "fixed-900 LightGBM identity+screen treatment-minus-control rank direction",
              "residual_weight": WEIGHT,
              "candidate_oof_auc": 0.9701014001897124,
              "candidate_oof_gain": 0.000002190827477,
              "leaderboard_score": None,
          }
          Path("kaggle/selected_submission.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, indent=2))
          PY
      - name: Commit verified artifact to campaign branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f kaggle/submission_nomophobia_v19_lgb015.csv
          git add kaggle/selected_submission.json
          git rm .github/workflows/materialize_selected_submission.yml
          git commit -m "Add verified frontier Kaggle submission"
          git push origin HEAD:agent/frontier-097-campaign
