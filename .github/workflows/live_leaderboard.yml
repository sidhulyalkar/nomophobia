name: te-smoothing-diversity
on:
  push:
    branches: [agent/te-smoothing-diversity]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install modeling stack
        run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'lightgbm>=4.3,<5' 'xgboost>=2.1,<4'
      - name: Acquire public mirror
        run: |
          git clone --depth 1 https://github.com/s23010843/Predicting-Smartphone-Addiction.git /tmp/s6e8-data
          mkdir -p /tmp/s6e8
          cp /tmp/s6e8-data/input/train.csv /tmp/s6e8/train.csv
      - name: Run screen
        run: python experiments/te_smoothing_diversity.py --data-dir /tmp/s6e8 --out te_smoothing_diversity.json --rows 120000 --estimators 1200
      - uses: actions/upload-artifact@v4
        with:
          name: te-smoothing-diversity
          path: te_smoothing_diversity.json
          retention-days: 7
