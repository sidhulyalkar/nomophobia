name: te-uncertainty-screen

on:
  push:
    branches:
      - agent/te-uncertainty-screen
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install modeling stack
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'lightgbm>=4.3,<5'
      - name: Acquire public mirror of competition CSVs
        run: |
          git clone --depth 1 https://github.com/s23010843/Predicting-Smartphone-Addiction.git /tmp/s6e8-data
          mkdir -p /tmp/s6e8
          cp /tmp/s6e8-data/input/train.csv /tmp/s6e8/train.csv
          cp /tmp/s6e8-data/input/test.csv /tmp/s6e8/test.csv
      - name: Run replicated TE uncertainty screen
        run: |
          python experiments/te_uncertainty_screen.py --data-dir /tmp/s6e8 --out te_uncertainty_screen.json --rows 120000 --estimators 1200 --inner-folds 5 --smoothing 10
      - uses: actions/upload-artifact@v4
        with:
          name: te-uncertainty-screen
          path: te_uncertainty_screen.json
          retention-days: 7
