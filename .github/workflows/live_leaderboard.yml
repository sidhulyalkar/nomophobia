name: live-smoothing20-full
on:
  push:
    branches: [agent/live-smoothing20-full]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install modeling stack
        run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'lightgbm>=4.3,<5' 'xgboost>=2.1,<4'
      - name: Acquire public mirror
        run: |
          git clone --depth 1 https://github.com/s23010843/Predicting-Smartphone-Addiction.git /tmp/s6e8-data
          mkdir -p /tmp/s6e8
          cp /tmp/s6e8-data/input/train.csv /tmp/s6e8/train.csv
          cp /tmp/s6e8-data/input/test.csv /tmp/s6e8/test.csv
          cp /tmp/s6e8-data/input/sample_submission.csv /tmp/s6e8/sample_submission.csv
      - name: Fit smoothing-20 candidate
        run: python experiments/live_smoothing20_candidate.py --data-dir /tmp/s6e8 --out-dir s20_results --estimators 4500
      - name: Compress prediction streams
        run: gzip -9 -k s20_results/submission_s20.csv
      - uses: actions/upload-artifact@v4
        with:
          name: live-smoothing20-full
          path: s20_results/
          retention-days: 7
          compression-level: 6
