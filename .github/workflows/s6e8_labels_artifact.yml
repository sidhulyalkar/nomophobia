name: s6e8-labels-artifact

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/s6e8_labels_artifact.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compact export dependencies
        run: pip install numpy pandas
      - name: Download mirror and export compact arrays
        run: |
          mkdir -p data artifacts/labels
          curl -fL --retry 5 https://raw.githubusercontent.com/s23010843/Predicting-Smartphone-Addiction/main/input/train.csv -o data/train.csv
          curl -fL --retry 5 https://raw.githubusercontent.com/s23010843/Predicting-Smartphone-Addiction/main/input/test.csv -o data/test.csv
          python - <<'PY'
          import numpy as np, pandas as pd, json
          tr=pd.read_csv('data/train.csv',usecols=['id','addicted_label'])
          te=pd.read_csv('data/test.csv',usecols=['id'])
          np.save('artifacts/labels/train_ids.npy',tr.id.to_numpy())
          np.save('artifacts/labels/target.npy',tr.addicted_label.to_numpy(np.int8))
          np.save('artifacts/labels/test_ids.npy',te.id.to_numpy())
          print(json.dumps({'train_rows':len(tr),'test_rows':len(te),'positive_rate':float(tr.addicted_label.mean())},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s6e8-compact-labels
          path: artifacts/labels
          retention-days: 7
