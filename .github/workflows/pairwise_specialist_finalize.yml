name: pairwise-specialist-finalize

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "experiments/finalize_pairwise_specialist.py"
      - ".github/workflows/pairwise_specialist_finalize.yml"

permissions:
  contents: read
  actions: read

jobs:
  finalize-specialist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Reuse completed pairwise cross-fit artifact
        uses: actions/download-artifact@v4
        with:
          name: pairwise-auc-residual
          path: /tmp/pairwise
          github-token: ${{ github.token }}
          repository: sidhulyalkar/nomophobia
          run-id: 32300228095
      - name: Run nested signed specialist finalizer
        run: |
          python experiments/finalize_pairwise_specialist.py \
            --pairwise-dir /tmp/pairwise \
            --out-dir results
      - uses: actions/upload-artifact@v4
        with:
          name: pairwise-specialist-final
          path: results
          retention-days: 7
