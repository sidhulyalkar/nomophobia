name: public-s6e8-artifact-audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/public_artifact_audit.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kagglehub numpy pandas scipy scikit-learn
      - name: Download public mirror labels
        run: |
          mkdir -p data
          curl -fL --retry 5 https://raw.githubusercontent.com/s23010843/Predicting-Smartphone-Addiction/main/input/train.csv -o data/train.csv
          curl -fL --retry 5 https://raw.githubusercontent.com/s23010843/Predicting-Smartphone-Addiction/main/input/test.csv -o data/test.csv
      - name: Download and audit published prediction datasets
        run: |
          cat > /tmp/audit.py <<'PY'
          import json, shutil
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import kagglehub
          from scipy.stats import rankdata
          from sklearn.metrics import roc_auc_score

          slugs = [
              'beicicc/s6e8-fixed-schedule-exact-value-catboost-artifacts',
              'beicicc/s6e8-fixed900-identity-digit-lightgbm-artifacts',
              'beicicc/s6e8-fixed1500-xgb-identity-digit-artifacts',
              'beicicc/s6e8-fixed1500-xgb-screen-relation-artifacts',
              'beicicc/s6e8-fixed-schedule-lookup-transformer-artifacts',
              'beicicc/s6e8-second-seed-fixed-schedule-lookup-artifacts',
              'beicicc/s6e8-fixed4-realmlp-two-seed-artifacts',
          ]
          train=pd.read_csv('data/train.csv'); test=pd.read_csv('data/test.csv')
          y=train['addicted_label'].to_numpy(int); ntr=len(train); nte=len(test)
          out=Path('artifacts/public_audit'); out.mkdir(parents=True,exist_ok=True)
          arrdir=out/'arrays'; arrdir.mkdir(exist_ok=True)
          report={'train_rows':ntr,'test_rows':nte,'datasets':{},'oof_arrays':[],'test_arrays':[]}
          oof={}
          for slug in slugs:
              item={'slug':slug,'status':'pending','files':[]}
              try:
                  root=Path(kagglehub.dataset_download(slug)); item['root']=str(root); item['status']='downloaded'
                  for p in sorted(root.rglob('*')):
                      if not p.is_file(): continue
                      rel=str(p.relative_to(root)); entry={'path':rel,'bytes':p.stat().st_size}
                      try:
                          if p.suffix.lower()=='.npy':
                              a=np.load(p,allow_pickle=False); entry['shape']=list(a.shape); entry['dtype']=str(a.dtype)
                              if a.ndim==1 and len(a)==ntr and np.issubdtype(a.dtype,np.number) and np.isfinite(a).all():
                                  auc=float(roc_auc_score(y,a)); entry['oof_auc']=auc
                                  name=slug.split('/')[-1]+'__'+p.stem
                                  oof[name]=np.asarray(a,float); np.save(arrdir/f'oof__{name}.npy',a)
                                  report['oof_arrays'].append({'name':name,'auc':auc,'source':slug,'path':rel})
                              elif a.ndim==1 and len(a)==nte and np.issubdtype(a.dtype,np.number) and np.isfinite(a).all():
                                  name=slug.split('/')[-1]+'__'+p.stem
                                  np.save(arrdir/f'test__{name}.npy',a)
                                  report['test_arrays'].append({'name':name,'source':slug,'path':rel})
                          elif p.suffix.lower()=='.csv' and p.stat().st_size < 120_000_000:
                              df=pd.read_csv(p); entry['shape']=[len(df),len(df.columns)]; entry['columns']=list(df.columns)[:40]
                              if len(df)==ntr:
                                  for c in df.select_dtypes(include='number').columns:
                                      if c in {'id','fold','addicted_label','target','index'}: continue
                                      a=df[c].to_numpy(float)
                                      if np.isfinite(a).all() and np.std(a)>1e-12:
                                          auc=float(roc_auc_score(y,a)); entry.setdefault('numeric_auc',{})[c]=auc
                                          name=slug.split('/')[-1]+'__'+p.stem+'__'+c
                                          oof[name]=a; np.save(arrdir/f'oof__{name}.npy',a)
                                          report['oof_arrays'].append({'name':name,'auc':auc,'source':slug,'path':rel,'column':c})
                              if len(df)==nte:
                                  for c in df.select_dtypes(include='number').columns:
                                      if c in {'id','fold','index'}: continue
                                      a=df[c].to_numpy(float)
                                      if np.isfinite(a).all() and np.std(a)>1e-12:
                                          name=slug.split('/')[-1]+'__'+p.stem+'__'+c
                                          np.save(arrdir/f'test__{name}.npy',a)
                                          report['test_arrays'].append({'name':name,'source':slug,'path':rel,'column':c})
                      except Exception as exc:
                          entry['inspect_error']=repr(exc)
                      item['files'].append(entry)
              except Exception as exc:
                  item['status']='failed'; item['error']=repr(exc)
              report['datasets'][slug]=item
          # deduplicate exact same arrays, then correlation table for strongest unique streams
          unique=[]
          for name,a in sorted(oof.items(), key=lambda kv: roc_auc_score(y,kv[1]), reverse=True):
              r=rankdata(a,method='average')
              duplicate=False
              for other,ro in unique:
                  if np.corrcoef(r,ro)[0,1] > 0.9999999:
                      duplicate=True; break
              if not duplicate: unique.append((name,r))
              if len(unique)>=30: break
          names=[x[0] for x in unique]
          if names:
              R=np.column_stack([x[1] for x in unique]); C=np.corrcoef(R,rowvar=False)
              pd.DataFrame(C,index=names,columns=names).to_csv(out/'rank_correlation.csv')
          report['unique_top_oof']=names
          report['oof_arrays']=sorted(report['oof_arrays'],key=lambda x:x['auc'],reverse=True)
          (out/'public_artifact_audit.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'datasets':{k:v['status'] for k,v in report['datasets'].items()},'top_oof':report['oof_arrays'][:20],'n_oof':len(report['oof_arrays']),'n_test':len(report['test_arrays'])},indent=2))
          PY
          python /tmp/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-s6e8-artifact-audit
          path: artifacts/public_audit
          retention-days: 7
