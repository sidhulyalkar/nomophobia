name: champion-offset-ranknet

on:
  workflow_dispatch:
  pull_request:
    branches: [agent/pairwise-auc-residual]
    paths:
      - "src/s6e8/offset_ranknet.py"
      - "experiments/offset_ranknet_campaign.py"
      - "tests/test_offset_ranknet.py"
      - ".github/workflows/offset_ranknet_compute.yml"

permissions:
  contents: read
  actions: read

jobs:
  offset-ranknet:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . pytest
      - name: Focused offset-RankNet test
        run: pytest -q tests/test_offset_ranknet.py
      - name: Acquire public competition mirror
        run: |
          git clone --depth 1 https://github.com/s23010843/Predicting-Smartphone-Addiction.git /tmp/datarepo
          mkdir -p /tmp/s6e8
          cp /tmp/datarepo/input/{train.csv,test.csv,sample_submission.csv} /tmp/s6e8/
      - name: Reuse audited v19 OOF and test predictions
        uses: actions/download-artifact@v4
        with:
          name: naji-public-blend-frontier-audit
          path: /tmp/naji
          github-token: ${{ github.token }}
          repository: sidhulyalkar/nomophobia
          run-id: 32192372800
      - name: Reuse measured LGB residual direction and folds
        uses: actions/download-artifact@v4
        with:
          name: contrast-lgb
          path: /tmp/lgb
          github-token: ${{ github.token }}
          repository: sidhulyalkar/nomophobia
          run-id: 32194910518
      - name: Run champion-offset RankNet campaign
        run: |
          python experiments/offset_ranknet_campaign.py \
            --data-dir /tmp/s6e8 \
            --v19-oof /tmp/naji/best_oof.csv \
            --v19-test /tmp/naji/best_submission.csv \
            --lgb-direction-dir /tmp/lgb \
            --out-dir results
      - uses: actions/upload-artifact@v4
        with:
          name: champion-offset-ranknet
          path: results
          retention-days: 7
