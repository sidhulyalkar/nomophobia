[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nomophobia-frontier"
version = "0.1.0"
description = "Falsification-first Kaggle research system for predicting smartphone addiction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "scipy>=1.12",
  "lightgbm>=4.3", "catboost>=1.2", "xgboost>=2.1", "joblib>=1.4", "torch>=2.4"
]

[tool.setuptools.packages.find]
where = ["src"]
